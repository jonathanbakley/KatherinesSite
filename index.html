<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Has Katherine Given Birth?</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <!-- Emoji fallback for browsers that don't render SVG favicons -->
  <link rel="alternate icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20x='50'%20y='50'%20font-size='84'%20text-anchor='middle'%20dominant-baseline='central'%3E%F0%9F%91%B6%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f1115;
      --no: #e63946;
      --yes: #2a9d8f;
      --fg: #f1f1f1;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 1.5rem;
      transition: background 0.6s ease;
    }
    h1 {
      font-weight: 600;
      font-size: clamp(1.6rem, 5vw, 3rem);
      margin: 0 0 1.5rem;
      letter-spacing: -0.01em;
    }
    #answer {
      font-weight: 800;
      font-size: clamp(5rem, 28vw, 14rem);
      line-height: 1;
      margin: 0;
      color: var(--no);
      transition: color 0.6s ease, transform 0.4s ease;
    }
    body.yes { --bg: #07140f; }
    body.yes #answer { color: var(--yes); }
    #sub {
      margin-top: 1.5rem;
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      opacity: 0.55;
      min-height: 1.4em;
    }
    body.yes #sub::after { content: "🎉 Congratulations! 🎉"; }
    #weight {
      margin-top: 0.75rem;
      font-size: clamp(1.1rem, 4vw, 2rem);
      font-weight: 700;
      color: var(--yes);
      display: none;
    }
    #weight.show { display: block; }
  </style>
</head>
<body>
  <h1>Has Katherine Given Birth?</h1>
  <p id="answer">…</p>
  <p id="weight"></p>
  <p id="sub"></p>

  <script>
    // The answer lives in answer.txt (just the word "NO" or "YES").
    // The baby's weight lives in weight.txt (e.g. "7 lbs 4 oz").
    // To update either, edit that one file on GitHub — no need to touch this page.

    // Turn whatever is typed in weight.txt into a clean "X lbs Y oz" string.
    // Accepts "7 lbs 4 oz", "7 4", "7lb 4oz", etc. Returns "" if no number found.
    function formatWeight(text) {
      const t = text.trim();
      if (!t) return '';
      const nums = t.match(/\d+/g);
      if (!nums) return t;                       // no digits: just show what was typed
      if (nums.length >= 2) return `${nums[0]} lbs ${nums[1]} oz`;
      return `${nums[0]} lbs`;
    }

    async function loadWeight() {
      try {
        const res = await fetch('weight.txt?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return '';
        return formatWeight(await res.text());
      } catch (e) {
        return '';
      }
    }

    async function loadAnswer() {
      try {
        // Cache-buster so updates show up immediately, not after GitHub's CDN cache expires.
        const res = await fetch('answer.txt?t=' + Date.now(), { cache: 'no-store' });
        const raw = (await res.text()).trim().toUpperCase();
        const isYes = raw === 'YES';
        document.getElementById('answer').textContent = isYes ? 'YES' : 'NO';
        document.body.classList.toggle('yes', isYes);

        // While the answer is NO, show a heads-up line. On YES it's cleared so the
        // "🎉 Congratulations! 🎉" message (added via CSS) shows instead.
        document.getElementById('sub').textContent =
          isYes ? '' : 'Expect an update in the next 1-2 days…';

        // Weight is only shown once the answer is YES and a weight has been entered.
        const weightEl = document.getElementById('weight');
        const weight = isYes ? await loadWeight() : '';
        if (weight) {
          weightEl.textContent = '👶 ' + weight;
          weightEl.classList.add('show');
        } else {
          weightEl.classList.remove('show');
        }
      } catch (e) {
        document.getElementById('answer').textContent = 'NO';
      }
    }
    loadAnswer();
    // Auto-refresh every 30s so an open tab updates itself when the answer changes.
    setInterval(loadAnswer, 30000);
  </script>
</body>
</html>
